name: Panel heater
products:
  - id: ui2crhdararfq16p
    manufacturer: Solaire
    model: Lyndo WIFI
entities:
  - entity: climate
    translation_only_key: heater
    dps:
      - id: 1
        name: hvac_mode
        type: boolean
        mapping:
          - dps_val: true
            value: "heat"
          - dps_val: false
            value: "off"
      - id: 2
        name: temperature
        type: integer
        unit: ℃C
        range:
          min: 50
          max: 350
        mapping:
          - scale: 10
            step: 5
      - id: 3
        name: current_temperature
        type: integer
        range:
          min: 0
          max: 500
        mapping:
          - scale: 10
            step: 5
      - id: 11
        name: hvac_action
        type: string
        mapping:
          - dps_val: "standby"
            value: idle
          - dps_val: "heating"
            value: heating
  - entity: sensor
  - entity: select
    name: Mode
    icon: "mdi:radiator"
    category: config
    dps:
      - id: 5
        name: option
        type: string
        mapping:
          - dps_val: "Standby"
            value: standby
          - dps_val: "Manual"
            value: manual
          - dps_val: "Program"
            value: program
          - dps_val: "Limit"
            value: limit
  - entity: lock
    translation_key: child_lock
    category: config
    dps:
      - id: 7
        type: boolean
        name: lock
  - entity: switch
    name: Sound
    icon: "mdi:music-note"
    category: config
    dps:
      - id: 8
        type: boolean
        name: switch
  - entity: sensor
    name: preset_mode
    dps:
      - id: 104
        name: preset_mode
        type: string
        readonly: true
        mapping:
          - dps_val: "comfort"
            value: comfort
          - dps_val: "ECO"
            value: eco
          - dps_val: "AF"
            value: away
  - entity: number
    name: Temperature calibration
    category: config
    class: temperature
    dps:
      - id: 101
        name: value
        type: integer
        unit: C
        range:
          min: -50
          max: 50
        mapping:
          scale: 10
          step: 5
  - entity: number
    name: Eco temperature
    category: config
    class: temperature
    unit: C
    range:
      min: 70
      max: 235
    dps:
      - id: 102
        type: integer
        mapping:
          - scale: 10
            step: 5
  - entity: switch
    name: Open window detection
    icon: "mdi:window-open-variant"
    category: config
    dps:
      - id: 103
        type: boolean
        name: switch
  - entity: number
    name: Comfort temperature
    category: config
    class: temperature
    unit: C
    range:
      min: 75
      max: 300
    dps:
      - id: 105
        type: integer
        mapping:
          - scale: 10
            step: 5
  - entity: number
    name: Away temperature
    category: config
    class: temperature
    unit: C
    range:
      min: 50
      max: 170
    dps:
      - id: 106
        type: integer
        mapping:
          - scale: 10
            step: 5
  - entity: sensor
    name: password
    dps:
      - id: 107
        type: integer
        sensitive: true
  - entity: binary_sensor
    name: Limit
    category: diagnostic
    dps:
      - id: 111
        name: sensor
        type: boolean
        mapping:
          - dps_val: true
            value: true
          - dps_val: false
            value: false
  - entity: sensor
    name: Energy today
    class: energy
    readonly: true
    dps:
      - id: 113
        name: sensor
        type: integer
        unit: kWh
        optional: true
        mapping:
          - scale: 10
  - entity: select
    translation_key: timer
    category: config
    dps:
      - id: 116
        type: string
        name: option
        mapping:
          - dps_val: cancel
            value: cancel
          - dps_val: "1h"
            value: 1h
          - dps_val: "2h"
            value: 2h
  - entity: number
    name: Boost temperature
    category: config
    class: temperature
    unit: C
    range:
      min: 50
      max: 350
    dps:
      - id: 118
        type: integer
        mapping:
          - scale: 10
            step: 5
  - entity: sensor
    translation_key: time_remaining
    class: duration
    readonly: true
    dps:
      - id: 119
        type: integer
        name: sensor
        unit: min
  - entity: sensor
    name: Total energy
    class: energy
    readonly: true
    dps:
      - id: 120
        name: sensor
        type: integer
        unit: kWh
        class: total_increasing
        optional: true
        mapping:
          - scale: 10
  - entity: button
    name: Energy reset
    category: config
    class: restart
    dps:
      - id: 121
        name: button
        type: boolean
        optional: true



